[project]
name = "screen-broadcast"
version = "1.0.0"
description = "局域网屏幕广播（Windows/macOS）：UDP 组播 + 瓦片增量传输"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "tsingke", email = "tsingke@hotmail.com" }]
keywords = ["screen-sharing", "classroom", "udp", "multicast", "tkinter", "windows", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: System :: Networking",
]
dependencies = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/tsingke/screen-broadcast"
Issues = "https://github.com/tsingke/screen-broadcast/issues"
